[project]
name = "formula-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.42.16",
    "daft[client]",
    "pyiceberg>=0.10.0",
    "ray[client,default]",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "memory-profiler>=0.61.0",
    "mypy>=1.19.0",
    "perf-timer>=0.2.2",
    "ruff>=0.14.9",
]

