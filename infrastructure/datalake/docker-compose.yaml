  #     POSTGRES_DB: ${MARQUEZ_DB_NAME}
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # marquez:
  #   image: marquezproject/marquez:latest
  #   container_name: marquez
  #   ports:
  #     - "3000:3000" # UI
  #     - "5000:5000" # API
  #   environment:
  #     - MARQUEZ_DB_HOST=db-marquez
  #     - MARQUEZ_DB_PORT=5432
  #     - MARQUEZ_DB_NAME=${MARQUEZ_DB_NAME}
  #     - MARQUEZ_DB_USER=${MARQUEZ_DB_USER}
  #     - MARQUEZ_DB_PASSWORD=${MARQUEZ_DB_PASSWORD}
  #   depends_on:
  #     db-marquez:
  #       condition: service_healthy

  # --- PROCESSING LAYER (Jupyter with Daft) ---
  daft-jupyter:
    image: jupyter/minimal-notebook:latest
    container_name: daft-jupyter
    ports:
      - "8888:8888"
    environment:
      - OPENLINEAGE_URL=http://marquez:5000
      - OPENLINEAGE_NAMESPACE=dev_lakehouse
      - AWS_ENDPOINT_URL=http://minio:9000
      - JUPYTER_ENABLE_LAB=yes
    volumes:
      - ./notebooks:/home/mac/job/bigdata/python-data-stack/notebooks
    # This command installs the necessary rust-powered tools on startup
    command: >
      start-notebook.sh --NotebookApp.token='' 
      --BeforeStarting.python_cmd='pip install getdaft openlineage-python pyiceberg'

# TOP-LEVEL DECLARATION
volumes:
  lakekeeper_db_data: